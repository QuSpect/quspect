# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html).
#
# The docs import the source tree directly (docs/source/conf.py puts the repo
# root on sys.path), so the C++ extension is NOT built here: only the pure
# Python dependencies in docs/requirements.txt are installed.  The same file
# serves the English project and its zh_CN translation project (RTD passes
# "-D language=zh_CN"; Sphinx compiles locale/*.po to .mo on the fly).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # RTD clones shallowly; fetch history and tags so conf.py can derive
      # the version from "git describe" (setuptools-scm style).
      - git fetch --unshallow --tags || git fetch --tags || true

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt

formats: []
